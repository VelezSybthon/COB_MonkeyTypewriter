<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>国中行银 · 综合录入训练</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 顶部横幅 -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">中</span>
        <div class="brand-text">
          <h1>国中行银综合录入训练</h1>
          <p>COB 综合录入训练系统 · 预录入信息与录入练习</p>
        </div>
      </div>
      <div class="topbar-side">
        <span class="topbar-badge">训练模式</span>
      </div>
    </div>
  </header>

  <div class="layout">

    <!-- 侧边 tab 栏（可收起） -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="sidebar-title">练习导航</span>
        <button type="button" class="sidebar-toggle" id="sidebarToggle" title="收起 / 展开侧边栏">«</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav" aria-label="练习导航"></nav>
      <div class="sidebar-foot">
        <span class="sidebar-foot-text">国中行银 · 录入训练 v1.0</span>
        <span class="sidebar-foot-icon">B</span>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main" id="main" tabindex="-1"></main>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
